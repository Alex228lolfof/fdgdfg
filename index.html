<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LUNA WEAR</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="logo">LUNA WEAR</div>
      <button class="cart-btn" onclick="showCart()">
        🛒 <span id="cart-count">0</span>
      </button>
    </header>

    <main id="content"></main>

    <nav class="bottom-nav">
      <button class="nav-btn active" onclick="showCatalog()">
        <span>🛍</span>
        <small>Каталог</small>
      </button>
      <button class="nav-btn" onclick="showCart()">
        <span>🛒</span>
        <small>Корзина</small>
      </button>
      <button class="nav-btn" onclick="showInfo()">
        <span>ℹ️</span>
        <small>Инфо</small>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
